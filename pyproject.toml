[project]
name = "claude-zotero"
version = "0.1.0"
description = "MCP server that lets AI agents add papers to Zotero by DOI and write Word documents with live, refreshable Zotero citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Moin Sabri" }]
keywords = ["zotero", "mcp", "claude", "citations", "research", "docx", "bibliography"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/Moin-11/claude-zotero"
Issues = "https://github.com/Moin-11/claude-zotero/issues"

[project.scripts]
claude-zotero-mcp = "claude_zotero.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_zotero"]
